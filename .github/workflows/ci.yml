name: CI

# Runs on every PR and every push to main. This is the quality gate:
# if `build` fails, the PR shows a red check. `typecheck` is informational
# only (the repo ships with some known Supabase type-gen quirks and
# next.config sets typescript.ignoreBuildErrors), so it never blocks merges.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # NEXT_PUBLIC_* values are inlined at build time. These placeholders
        # only need to be present/well-formed for the build to complete — no
        # network calls happen, and real values are injected by Vercel at
        # deploy time. They are public by nature, so it is safe to hardcode them.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
        run: npm run build

  typecheck:
    name: Type check (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit
