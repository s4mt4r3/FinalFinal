name: Supabase keepalive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # RLS makes this return [] for anon, which still counts as database activity.
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/resumes?select=id&limit=1")
          echo "Supabase responded with HTTP $status"
          test "$status" = "200"
